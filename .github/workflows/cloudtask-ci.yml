      name: CloudTask CI

      on:
        push:
        pull_request:

      jobs:
        verify-dockerhub-secrets:
          runs-on: ubuntu-latest
          steps:
            - name: Verify Docker Hub secrets
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                if [ -z "$DOCKERHUB_USERNAME" ]; then
                  echo "DOCKERHUB_USERNAME is missing or empty"
                  exit 1
                fi
                if [ -z "$DOCKERHUB_TOKEN" ]; then
                  echo "DOCKERHUB_TOKEN is missing or empty"
                  exit 1
                fi
                echo "Both Docker Hub secrets are configured"