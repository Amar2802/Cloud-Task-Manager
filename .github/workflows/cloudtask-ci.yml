name: CloudTask CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check backend syntax
        working-directory: server
        run: |
          node --check server.js
          node --check routes/tasks.js
          node --check models/Task.js

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cloudtask-backend:ci ./server

      - name: Build frontend image
        run: docker build -t cloudtask-frontend:ci ./client

  publish:
    name: Publish Images to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Docker Hub username
        id: dockerhub
        shell: bash
        env:
          RAW_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          username="$(printf '%s' "$RAW_DOCKERHUB_USERNAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$username" ]; then
            echo "DOCKERHUB_USERNAME is missing or empty after trimming whitespace"
            exit 1
          fi
          printf 'username=%s\n' "$username" >> "$GITHUB_OUTPUT"

      - name: Verify Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN is missing or empty"
            exit 1
          fi
          echo "Docker Hub token is available"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.username }}/cloudtask-backend:latest
            ${{ steps.dockerhub.outputs.username }}/cloudtask-backend:sha-${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.username }}/cloudtask-frontend:latest
            ${{ steps.dockerhub.outputs.username }}/cloudtask-frontend:sha-${{ github.sha }}
